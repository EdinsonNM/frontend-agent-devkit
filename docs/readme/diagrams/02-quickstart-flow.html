<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>frontend-agent-devkit · Inicio rapido</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Geist', system-ui, sans-serif;
      background: #f5f5f5;
      color: #2d3142;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 520px; width: 100%; }
    .eyebrow {
      font-family: 'Geist Mono', monospace;
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #4f5d75;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.75rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
    }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · frontend-agent-devkit</p>
    <h1>Tres pasos para empezar</h1>
    <svg viewBox="0 0 520 640" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <line x1="260" y1="72" x2="260" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="260" y1="152" x2="260" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="260" y1="232" x2="260" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="260" y1="312" x2="260" y2="336" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="260" y1="392" x2="260" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="260" y1="472" x2="260" y2="496" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- 1 -->
      <rect x="120" y="24" width="280" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="260" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tu repo frontend</text>

      <!-- 2 install -->
      <rect x="80" y="96" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="260" y="120" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1 · Instalar</text>
      <text x="260" y="138" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">npx frontend-agent-devkit init --tool cursor</text>

      <!-- 3 discovery -->
      <rect x="80" y="176" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="260" y="200" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2 · Discovery (una vez)</text>
      <text x="260" y="218" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/orquestador + explorar sin tocar codigo</text>

      <!-- 4 docs -->
      <rect x="80" y="256" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="260" y="280" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rellenar docs/ con la realidad</text>
      <text x="260" y="298" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">overview · boundaries · scripts</text>

      <!-- 5 orchestrator focal -->
      <rect x="80" y="336" width="360" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="260" y="360" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3 · Cada tarea nueva</text>
      <text x="260" y="378" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/orquestador + lo que necesitas</text>

      <!-- 6 delegate -->
      <rect x="80" y="416" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="260" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">El orquestador elige modo y agente</text>
      <text x="260" y="458" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Spec Kit · Mini Spec · tarea directa</text>

      <!-- 7 end -->
      <rect x="120" y="496" width="280" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="260" y="522" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Implementar con boundaries</text>
      <text x="260" y="540" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">validacion acordada</text>

      <!-- step badges -->
      <rect x="40" y="108" width="28" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
      <text x="54" y="119" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">CLI</text>
      <rect x="40" y="188" width="28" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
      <text x="54" y="199" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">1x</text>
      <rect x="40" y="348" width="28" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="54" y="359" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">SI</text>

      <text x="260" y="600" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">frontend-agent-devkit verify · comprueba agentes, skills y comandos</text>
    </svg>
  </div>
</body>
</html>
